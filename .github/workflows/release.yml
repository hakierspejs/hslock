name: release

# Manual-only: builds firmware for whichever branch/tag is selected when
# dispatching this workflow (defaults to master) and publishes hslock.uf2 as
# a GitHub Release. There's no semver here - the commit hash *is* the
# version (see version.h.in / `version` console command), so the release is
# tagged with the short SHA of the ref that was built.
on:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hslock-uf2-${{ github.sha }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_SHA::7}"
          gh release create "$tag" hslock.uf2 \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes "Manually triggered firmware build from commit $GITHUB_SHA" \
            --target "$GITHUB_SHA"
